<html lang="en"><head>

</head><body class="inner-page">
  <nav class="navbar"><div class="nav-container"><div class="logo"><strong>Masum Billah</strong></div><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="index.html#projects">Projects</a></li><li><a href="contact.html">Contact</a></li></ul><a href="hire-me.html" class="nav-hire-btn">Hire Me</a></div></nav>
  <main class="chat-page"><section class="chat-panel admin-panel">
    <div class="chat-panel-header"><div><p class="eyebrow">Private Dashboard</p><h1>Chat Inbox</h1><p id="admin-status">Sign in with your admin Google account.</p></div><button id="admin-login" class="google-login"><i class="fa-brands fa-google"></i> Admin Sign In</button><button id="admin-sign-out" class="sign-out hidden">Sign out</button></div>

  </section></main>
